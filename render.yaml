databases:
  - name: concord-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: concord-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_DRIVER
        value: postgres
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: concord-db
          property: connectionString
      - key: PAYMENT_ASSETS_JSON
        value: '{"polygon":{"address":"0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174","decimals":6,"symbol":"USDC"}}'
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: concord-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: INDEXER_SECRET
        generateValue: true
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: FACTORY_ADDRESS
        sync: false
      - key: SWEEPER_INIT_CODE_HASH
        sync: false
      - key: REGISTRAR_PRIVATE_KEY
        sync: false
      - key: POLYGON_RPC_URL
        sync: false

  - type: worker
    name: concord-indexer
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node indexer.js
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: concord-db
          property: connectionString
      - key: FACTORY_ADDRESS
        fromService:
          type: web
          name: concord-backend
          envVarKey: FACTORY_ADDRESS
      - key: INDEXER_SECRET
        fromService:
          type: web
          name: concord-backend
          envVarKey: INDEXER_SECRET
      - key: POLYGON_RPC_URL
        fromService:
          type: web
          name: concord-backend
          envVarKey: POLYGON_RPC_URL
      - key: API_HOSTPORT
        fromService:
          type: web
          name: concord-backend
          property: hostport

  - type: web
    runtime: static
    name: concord-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: concord-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_PRIVY_APP_ID
        fromService:
          type: web
          name: concord-backend
          envVarKey: PRIVY_APP_ID
